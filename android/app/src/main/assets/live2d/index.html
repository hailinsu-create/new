<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      touch-action: none;
    }
    #stage {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
  </style>
</head>
<body>
<div id="stage"></div>
<script src="js/live2dcubismcore.min.js"></script>
<script src="js/pixi.min.js"></script>
<script src="js/cubism4.min.js"></script>
<script>
(function () {
  const MOOD_EXPR = {
    IDLE: null,
    TALK: "exp_01",
    THINK: "exp_08",
    HAPPY: "exp_04",
    CARE: "exp_02",
    SURPRISE: "exp_07",
    SHY: "exp_06"
  };

  let app = null;
  let model = null;
  let mouthTimer = null;
  let holdTimer = null;
  let ready = false;
  let currentMood = "IDLE";
  const MODEL_URL = "model/Mao/Mao.model3.json";

  function log() {
    try {
      var args = Array.prototype.slice.call(arguments);
      console.log.apply(console, ["[PangchuangLive2D]"].concat(args));
      notifyAndroid("log:" + args.join(" "));
    } catch (e) {}
  }

  function notifyAndroid(msg) {
    try {
      if (window.PangchuangBridge && window.PangchuangBridge.onLive2dEvent) {
        window.PangchuangBridge.onLive2dEvent(String(msg));
      }
    } catch (e) {}
  }

  function sleep(ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  }

  function coreModel() {
    try {
      return model && model.internalModel && model.internalModel.coreModel;
    } catch (e) {
      return null;
    }
  }

  function setParam(id, value) {
    var core = coreModel();
    if (!core) return;
    if (typeof core.setParameterValueById === "function") {
      core.setParameterValueById(id, value);
    }
  }

  function clearExpression() {
    try {
      if (model && model.internalModel && model.internalModel.motionManager &&
          model.internalModel.motionManager.expressionManager) {
        model.internalModel.motionManager.expressionManager.resetExpression();
      }
    } catch (e) {}
  }

  function applyMood(mood) {
    currentMood = mood || "IDLE";
    var expr = MOOD_EXPR[currentMood];
    clearExpression();
    if (expr && model && typeof model.expression === "function") {
      try { model.expression(expr); } catch (e) { log("expression fail", expr, e && e.message); }
    }
  }

  function stopMouth() {
    if (mouthTimer) {
      clearInterval(mouthTimer);
      mouthTimer = null;
    }
    setParam("ParamA", 0);
  }

  function stageSize() {
    var stage = document.getElementById("stage");
    var w = (stage && stage.clientWidth) || window.innerWidth || 1;
    var h = (stage && stage.clientHeight) || window.innerHeight || 1;
    return { w: Math.max(1, w), h: Math.max(1, h) };
  }

  function layoutModel() {
    if (!app || !model) return;
    var size = stageSize();
    app.renderer.resize(size.w, size.h);
    // Zoom into upper body / face for the floating circle.
    var scale = Math.min(size.w, size.h) / 620;
    model.anchor.set(0.5, 0.5);
    model.scale.set(scale);
    model.x = size.w * 0.5;
    model.y = size.h * 0.78;
  }

  function waitForSize() {
    return new Promise(function (resolve) {
      var tries = 0;
      (function tick() {
        var size = stageSize();
        if ((size.w >= 8 && size.h >= 8) || tries > 40) {
          resolve(size);
          return;
        }
        tries += 1;
        requestAnimationFrame(tick);
      })();
    });
  }

  async function waitForCore() {
    for (var i = 0; i < 80; i++) {
      if (window.Live2DCubismCore) return;
      await sleep(50);
    }
    throw new Error("Live2DCubismCore missing (WASM/core script)");
  }

  async function waitForPixiLive2d() {
    for (var i = 0; i < 80; i++) {
      if (window.PIXI && PIXI.live2d && PIXI.live2d.Live2DModel) return;
      await sleep(50);
    }
    throw new Error("PIXI.live2d.Live2DModel missing");
  }

  async function boot() {
    try {
      notifyAndroid("boot");
      log("href", location.href);
      log("UA", navigator.userAgent);
      await waitForSize();
      await waitForCore();
      log("core ok", typeof Live2DCubismCore);
      await waitForPixiLive2d();
      log("pixi live2d ok");

      if (typeof PIXI.live2d.startUpCubism4 === "function") {
        try {
          await PIXI.live2d.startUpCubism4();
          log("startUpCubism4 done");
        } catch (e) {
          log("startUpCubism4 skip", e && e.message);
        }
      }

      var size = stageSize();
      app = new PIXI.Application({
        width: size.w,
        height: size.h,
        backgroundAlpha: 0,
        antialias: true,
        autoDensity: true,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        powerPreference: "high-performance"
      });
      document.getElementById("stage").appendChild(app.view);

      log("load model", MODEL_URL);
      model = await PIXI.live2d.Live2DModel.from(MODEL_URL, {
        autoInteract: false,
        autoUpdate: true
      });
      app.stage.addChild(model);
      layoutModel();
      window.addEventListener("resize", layoutModel);

      try { model.motion("Idle"); } catch (e) {}
      applyMood("IDLE");
      ready = true;
      log("ready");
      notifyAndroid("ready");
    } catch (err) {
      var msg = (err && err.message) ? err.message : String(err);
      console.error(err);
      notifyAndroid("error:" + msg);
    }
  }

  window.PangchuangLive2D = {
    isReady: function () { return ready; },
    setMood: function (mood) {
      applyMood(String(mood || "IDLE").toUpperCase());
    },
    speak: function (durationMs, mood) {
      if (!ready || !model) return;
      var dur = Math.max(600, Math.min(5000, Number(durationMs) || 1600));
      applyMood(String(mood || "TALK").toUpperCase());
      stopMouth();
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      var start = Date.now();
      mouthTimer = setInterval(function () {
        var t = (Date.now() - start) / 1000;
        var open = 0.35 + 0.55 * Math.abs(Math.sin(t * 10.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 3.2)));
        setParam("ParamA", open);
        setParam("ParamMouthUp", Math.min(1, open * 0.35));
      }, 42);

      try {
        var m = String(mood || "").toUpperCase();
        if (m === "HAPPY" || m === "SHY" || m === "SURPRISE") {
          model.motion("TapBody");
        }
      } catch (e) {}

      holdTimer = setTimeout(function () {
        stopMouth();
        holdTimer = setTimeout(function () {
          try { model.motion("Idle"); } catch (e) {}
          applyMood("IDLE");
          notifyAndroid("speak_end");
        }, 900);
      }, dur);
    },
    idle: function () {
      stopMouth();
      if (holdTimer) {
        clearTimeout(holdTimer);
        holdTimer = null;
      }
      try { model.motion("Idle"); } catch (e) {}
      applyMood("IDLE");
    },
    tap: function () {
      if (!ready || !model) return;
      try { model.motion("TapBody"); } catch (e) {}
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function () { boot(); });
  } else {
    boot();
  }
})();
</script>
</body>
</html>
