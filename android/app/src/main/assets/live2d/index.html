<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; touch-action: none; }
    #stage { position: absolute; inset: 0; width: 100%; height: 100%; }
    canvas { display: block; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body>
<div id="stage"></div>
<script>
(function () {
  const BASE = (function () {
    // Prefer absolute asset base so model/js resolve under WebViewAssetLoader.
    var href = location.href || "";
    var idx = href.lastIndexOf("/");
    return idx >= 0 ? href.slice(0, idx + 1) : "./";
  })();

  const MOOD_EXPR = {
    IDLE: null,
    TALK: "exp_01",
    THINK: "exp_08",
    HAPPY: "exp_04",
    CARE: "exp_02",
    SURPRISE: "exp_07",
    SHY: "exp_06"
  };

  let app = null;
  let model = null;
  let mouthTimer = null;
  let holdTimer = null;
  let ready = false;
  const MODEL_URL = BASE + "model/Mao/Mao.model3.json";

  function notifyAndroid(msg) {
    try {
      if (window.PangchuangBridge && window.PangchuangBridge.onLive2dEvent) {
        window.PangchuangBridge.onLive2dEvent(String(msg));
      }
    } catch (e) {}
  }

  function log() {
    var args = Array.prototype.slice.call(arguments);
    try { console.log.apply(console, ["[PangchuangLive2D]"].concat(args)); } catch (e) {}
    notifyAndroid("log:" + args.join(" "));
  }

  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }

  function loadScript(src) {
    return new Promise(function (resolve, reject) {
      var s = document.createElement("script");
      s.src = src;
      s.async = false;
      s.onload = function () { resolve(src); };
      s.onerror = function () { reject(new Error("script fail: " + src)); };
      document.head.appendChild(s);
    });
  }

  function stageSize() {
    var stage = document.getElementById("stage");
    var w = (stage && stage.clientWidth) || window.innerWidth || 1;
    var h = (stage && stage.clientHeight) || window.innerHeight || 1;
    return { w: Math.max(1, w), h: Math.max(1, h) };
  }

  function waitForSize() {
    return new Promise(function (resolve) {
      var tries = 0;
      (function tick() {
        var size = stageSize();
        if ((size.w >= 8 && size.h >= 8) || tries > 60) return resolve(size);
        tries += 1;
        requestAnimationFrame(tick);
      })();
    });
  }

  function coreModel() {
    try { return model && model.internalModel && model.internalModel.coreModel; }
    catch (e) { return null; }
  }

  function setParam(id, value) {
    var core = coreModel();
    if (!core) return;
    if (typeof core.setParameterValueById === "function") core.setParameterValueById(id, value);
  }

  function clearExpression() {
    try {
      if (model && model.internalModel && model.internalModel.motionManager &&
          model.internalModel.motionManager.expressionManager) {
        model.internalModel.motionManager.expressionManager.resetExpression();
      }
    } catch (e) {}
  }

  function applyMood(mood) {
    var expr = MOOD_EXPR[mood || "IDLE"];
    clearExpression();
    if (expr && model && typeof model.expression === "function") {
      try { model.expression(expr); } catch (e) {}
    }
  }

  function stopMouth() {
    if (mouthTimer) { clearInterval(mouthTimer); mouthTimer = null; }
    setParam("ParamA", 0);
  }

  function layoutModel() {
    if (!app || !model) return;
    var size = stageSize();
    app.renderer.resize(size.w, size.h);
    var scale = Math.min(size.w, size.h) / 620;
    model.anchor.set(0.5, 0.5);
    model.scale.set(scale);
    model.x = size.w * 0.5;
    model.y = size.h * 0.78;
  }

  async function probeModelUrl() {
    try {
      var res = await fetch(MODEL_URL, { method: "GET", cache: "no-store" });
      log("model fetch", res.status, MODEL_URL, "ct=" + (res.headers.get("content-type") || ""));
      if (!res.ok) throw new Error("model HTTP " + res.status);
      var text = await res.text();
      if (text.indexOf("FileReferences") < 0) {
        throw new Error("model3.json invalid body len=" + text.length);
      }
      log("model3.json ok bytes", text.length);
    } catch (e) {
      throw new Error("model missing: " + (e && e.message ? e.message : e) + " url=" + MODEL_URL);
    }
  }

  async function boot() {
    try {
      notifyAndroid("boot");
      log("href", location.href);
      log("base", BASE);
      await waitForSize();

      await loadScript(BASE + "js/live2dcubismcore.min.js");
      log("core script loaded", typeof window.Live2DCubismCore);
      if (!window.Live2DCubismCore) throw new Error("Live2DCubismCore missing after script");

      await loadScript(BASE + "js/pixi.min.js");
      log("pixi loaded", typeof window.PIXI, !!(window.PIXI && PIXI.Application));
      if (!window.PIXI || !PIXI.Application) throw new Error("PIXI.Application missing");

      await loadScript(BASE + "js/cubism4.min.js");
      log("cubism4 loaded", !!(PIXI.live2d), !!(PIXI.live2d && PIXI.live2d.Live2DModel));

      // Give UMD a tick; some WebViews attach globals late.
      for (var i = 0; i < 40; i++) {
        if (PIXI.live2d && PIXI.live2d.Live2DModel) break;
        await sleep(50);
      }
      if (!PIXI.live2d || !PIXI.live2d.Live2DModel) {
        throw new Error("Live2DModel missing keys=" + Object.keys(PIXI.live2d || {}).join(","));
      }

      if (typeof PIXI.live2d.startUpCubism4 === "function") {
        try {
          await PIXI.live2d.startUpCubism4();
          log("startUpCubism4 ok");
        } catch (e) {
          log("startUpCubism4 warn", e && e.message);
        }
      }

      await probeModelUrl();

      var size = stageSize();
      app = new PIXI.Application({
        width: size.w,
        height: size.h,
        backgroundAlpha: 0,
        antialias: true,
        autoDensity: true,
        resolution: Math.min(window.devicePixelRatio || 1, 2),
        powerPreference: "high-performance"
      });
      document.getElementById("stage").appendChild(app.view);

      log("Live2DModel.from", MODEL_URL);
      model = await PIXI.live2d.Live2DModel.from(MODEL_URL, {
        autoInteract: false,
        autoUpdate: true
      });
      app.stage.addChild(model);
      layoutModel();
      window.addEventListener("resize", layoutModel);
      try { model.motion("Idle"); } catch (e) {}
      applyMood("IDLE");
      ready = true;
      log("ready");
      notifyAndroid("ready");
    } catch (err) {
      var msg = (err && err.message) ? err.message : String(err);
      console.error(err);
      notifyAndroid("error:" + msg);
    }
  }

  window.PangchuangLive2D = {
    isReady: function () { return ready; },
    setMood: function (mood) { applyMood(String(mood || "IDLE").toUpperCase()); },
    speak: function (durationMs, mood) {
      if (!ready || !model) return;
      var dur = Math.max(600, Math.min(5000, Number(durationMs) || 1600));
      applyMood(String(mood || "TALK").toUpperCase());
      stopMouth();
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      var start = Date.now();
      mouthTimer = setInterval(function () {
        var t = (Date.now() - start) / 1000;
        var open = 0.35 + 0.55 * Math.abs(Math.sin(t * 10.5)) * (0.55 + 0.45 * Math.abs(Math.sin(t * 3.2)));
        setParam("ParamA", open);
        setParam("ParamMouthUp", Math.min(1, open * 0.35));
      }, 42);
      try {
        var m = String(mood || "").toUpperCase();
        if (m === "HAPPY" || m === "SHY" || m === "SURPRISE") model.motion("TapBody");
      } catch (e) {}
      holdTimer = setTimeout(function () {
        stopMouth();
        holdTimer = setTimeout(function () {
          try { model.motion("Idle"); } catch (e) {}
          applyMood("IDLE");
          notifyAndroid("speak_end");
        }, 900);
      }, dur);
    },
    idle: function () {
      stopMouth();
      if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
      try { model.motion("Idle"); } catch (e) {}
      applyMood("IDLE");
    },
    tap: function () {
      if (!ready || !model) return;
      try { model.motion("TapBody"); } catch (e) {}
    }
  };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
