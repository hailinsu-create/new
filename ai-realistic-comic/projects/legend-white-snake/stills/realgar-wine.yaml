id: realgar-wine
title: 雄黄酒
characters:
- baisuzhen
- xuxian
setting: a candlelit bedchamber behind a half-drawn silk bed curtain, a low table with a wine cup, shadows
  of coiling scales moving on the curtain
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: low warm candlelight from one side, cold teal light from her skin, the soft shadow of a coil
  on the silk
blocking: Xu Xian sits on the edge of the bed and holds Bai Suzhen against his shoulder as she trembles
  and turns her face toward him, her cheek on his collarbone, eyes half-closed and a few faint scales
  glimmering at her neckline and temple; he looks down at her with worry and tenderness, his lips near
  her hair; her hands are hidden against his chest under the fold of his robe; his arms are around her
  back, hidden by her long hair
wardrobe_state: her white silk sleeping robe slips off one shoulder over an opaque lining, loosely tied
  sash; his indigo inner robe open at the collar; both covered
motif: 'trust at the moment of exposure: the human who does not look away from what she is, tenderness
  over fear'
mood: dark, tender, hushed, intimate
negative: anime, cartoon, collage, split screen, twins, merged faces, illustration, painting, 3D render,
  CGI, concept art, extra fingers, deformed hands, text, watermark, minor, child
