id: coil-embrace
title: 缠
characters: [baisuzhen_snake, xuxian]
setting: moonlit abandoned boat house on a misty West Lake, wet wooden floor, paper lanterns dimmed to embers, black water and mist beyond the open window, drifting petals
camera: 85mm portrait lens at f/1.8, intimate medium shot from the side, both figures from the knees up with the tail coils filling the foreground, shallow depth of field
lighting: cold teal moonlight through the window, faint glowing teal from her scales and belly scutes, one low warm lantern ember on their faces, mist
blocking: >-
  Xu Xian sits on the floor with his back against a wooden pillar, calm and tender, one hand resting on her cheek;
  Bai Suzhen in serpent form leans over him, her long pearl-white tail looped loosely around his waist and legs in a slow
  embrace, one hand on his chest over his heart, her forehead against his, her pale gold eyes half-closed; their lips almost
  touching, a drifting petal between them
wardrobe_state: >-
  Bai Suzhen's ink-black sheer gauze top slides off her shoulders over an opaque white lining with a plunging neckline, the
  gauze skirt dissolving into scales at her hips; Xu Xian's dark indigo gown hangs open at the chest, bare collarbone and
  forearms; both fully covered
motif: >-
  gentle consensual serpent entwinement and trust: the dangerous white-snake spirit coiling around the mortal who is not
  afraid of her, tenderness over menace, scales against cloth and skin
mood: dark, tender, hushed, intimate
