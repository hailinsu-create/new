id: umbrella-bridge
title: 借伞
characters:
- baisuzhen
- xuxian
setting: the Broken Bridge on West Lake in soft night rain, willow branches, misty water, a single paper
  lantern, a large oil-paper umbrella
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: warm lantern glow under the umbrella, cool teal moonlight on the wet bridge, rain streaks, mist
blocking: Bai Suzhen and Xu Xian stand very close under one oil-paper umbrella held by him, his arm raised
  above them; she leans toward him with her face tilted up and her lips near his, raindrops on her lashes,
  her pale-gold eyes half-closed; both of her hands hold the front of his robe at his chest; his free
  hand is out of frame; their foreheads almost touching
wardrobe_state: her white silk dress with a sheer black overgarment is soaked and clings softly, plunging
  neckline, fully covered; his dark indigo robe damp at the shoulders, open at the collar
motif: 'the first umbrella and the first spark: a mortal and a snake spirit sharing a single shelter,
  tenderness charged with danger'
mood: dark, tender, rainy, intimate
negative: anime, cartoon, collage, split screen, twins, merged faces, illustration, painting, 3D render,
  CGI, concept art, extra fingers, deformed hands, text, watermark, minor, child
