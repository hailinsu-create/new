id: lake-surface
title: 水面
characters:
- baisuzhen_snake
- xuxian
setting: a small wooden boat drifting on a moonlit misty lake, the white tail curling in the black water
  beside the hull, floating petals, a dim lantern
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: cold teal moonlight and its reflection on the water, faint teal glow from her scales, one warm
  lantern ember on their faces
blocking: Xu Xian leans over the side of the boat toward Bai Suzhen, who rises from the water to the waist
  beside him, her wet black hair clinging, her pearl-white tail coiled in the water below the frame; their
  faces are almost touching with their reflections joining on the surface; her arms are folded on the
  boat rail and his hands rest on the rail beside hers, partly in shadow; she looks up at him with half-closed
  pale-gold eyes
wardrobe_state: her ink-black sheer gauze top soaked and clinging over an opaque white lining with a plunging
  neckline, dissolving into scales at the waist; his dark indigo robe damp, collar open; both covered
motif: 'the lake as threshold between human and serpent: tenderness on the surface, the deep tail unseen
  below'
mood: dark, tender, hushed, mythic
negative: anime, cartoon, collage, split screen, twins, merged faces, illustration, painting, 3D render,
  CGI, concept art, extra fingers, deformed hands, text, watermark, minor, child
