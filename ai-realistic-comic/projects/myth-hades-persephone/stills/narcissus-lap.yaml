id: narcissus-lap
title: 水仙
characters:
- persephone
- hades
setting: a silent underworld garden of pale glowing narcissus flowers under a black sky, thin mist, a
  black stone bench
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: faint silver-white glow rising from the flowers onto their faces, cold rim light, a single warm
  ember of light in her hair
blocking: the olive-skinned woman lies back across the lap of the pale dark-haired man on the stone bench,
  her head resting in the crook of his arm and her long hair spilling over his sleeve; he looks down at
  her from very close with a soft, intent gaze; her eyes are half-open looking up; their faces a hand-width
  apart; both hands rest out of frame below the shoulders; a few pomegranate seeds scattered on her collarbone
wardrobe_state: her gown off both shoulders over opaque black lining, deep neckline, flower crown among
  the narcissus; his open black cloak over a bare chest; both covered
motif: 'forbidden tenderness: the death-king watching his queen as she lies among flowers that bloom for
  her alone'
mood: dark, dreamlike, hushed, devotional
negative: anime, cartoon, collage, split screen, twins, merged faces, blue skin, red hair, glowing red
  eyes, trident, staff, spear, pointed elf ears, illustration, painting, 3D render, CGI, concept art,
  extra fingers, deformed hands, text, watermark, minor, child
