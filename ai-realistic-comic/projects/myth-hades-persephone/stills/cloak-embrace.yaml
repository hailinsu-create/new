id: cloak-embrace
title: 斗篷
characters:
- persephone
- hades
setting: a long colonnade of black obsidian pillars above the black river, drifting mist, far-off amber
  torches, a fur-lined black cloak
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: low-key amber torchlight from one side, cool blue haze behind, deep shadows
blocking: the pale dark-haired man stands behind the olive-skinned woman and wraps his heavy fur-lined
  cloak around both of them, his chin resting on her shoulder and his lips near her ear; she tilts her
  head back against his cheek with eyes half-closed and a small smile; both hands are tucked inside the
  cloak, out of sight; one split pomegranate in the soft foreground
wardrobe_state: her dark green and black sheer gauze gown slips off one shoulder over an opaque black
  lining, red silk sash, wilted flower crown; his bare chest under the open cloak, silver chain; both
  covered inside the cloak
motif: 'shelter and quiet surrender: a ruler wrapping a woman in his own cloak, protective tenderness,
  slow-burn intimacy'
mood: dark, hushed, protective, sensual
negative: anime, cartoon, collage, split screen, twins, merged faces, blue skin, red hair, glowing red
  eyes, trident, staff, spear, pointed elf ears, illustration, painting, 3D render, CGI, concept art,
  extra fingers, deformed hands, text, watermark, minor, child
