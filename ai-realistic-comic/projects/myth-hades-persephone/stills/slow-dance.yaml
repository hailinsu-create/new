id: slow-dance
title: 缓舞
characters:
- persephone
- hades
setting: an empty obsidian ballroom of the underworld with a polished black floor reflecting amber candelabras,
  mist at the edges
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up so legs and
  feet are out of frame, shallow depth of field
lighting: warm amber candle bokeh behind them, cool rim light on shoulders, deep shadows
blocking: the pale dark-haired man and the olive-skinned woman dance slowly, foreheads touching, eyes
  closed, her cheek and temple pressed to his, her hair swaying; her arms are around his neck with hands
  hidden under his hair; his arms are around her back with hands hidden by her hair and the cloak; chest
  to chest, a shared breath
wardrobe_state: her gown off both shoulders over opaque black lining, red silk sash trailing, flower crown;
  his black fur-collared cloak open over a bare chest; both covered
motif: 'mutual consent and slow-burn intimacy: two rulers dropping their guard in an empty hall'
mood: dark, hushed, sensual, romantic
negative: anime, cartoon, collage, split screen, twins, merged faces, blue skin, red hair, glowing red
  eyes, trident, staff, spear, pointed elf ears, illustration, painting, 3D render, CGI, concept art,
  extra fingers, deformed hands, text, watermark, minor, child
