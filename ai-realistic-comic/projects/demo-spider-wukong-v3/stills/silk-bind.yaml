id: silk-bind
title: 缚·丝
characters: [zhizhu, wukong]
setting: dim silk boudoir inside the spider cave, hanging violet gauze curtains, rose petals on a low lacquered platform, warm candlelight mixed with violet glow
camera: 85mm portrait lens at f/1.8, intimate medium close shot, slightly low angle, faces and upper bodies, shallow depth of field
lighting: warm candle key from the left, violet rim light from the glowing silk, soft specular highlights on skin and fur
blocking: >-
  Wukong sits on the platform with his back against a carved pillar, wrists loosely wound with glowing violet silk
  (he lets it happen, amused smirk); Zhizhu kneels over him on one knee, one hand holding the silk thread taut,
  the other cupping his furred jaw, her face a hand's width from his; their eyes locked; her long black hair falls over
  his shoulder
wardrobe_state: >-
  Zhizhu's sheer black-violet gauze robe slides off both shoulders but stays on, silk sash tied at the waist, high slit
  showing her thigh; Wukong's tiger-skin skirt and open ochre chest wrap in place, golden fillet on his brow; both fully covered
motif: >-
  consensual playful silk-bondage tension and fur-versus-skin contrast: the powerful Monkey King willingly yielding to the
  spider seductress, her control and his teasing resistance
mood: slow-burn, teasing, charged, adult
