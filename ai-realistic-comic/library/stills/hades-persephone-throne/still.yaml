id: throne-pomegranate
title: 石榴籽
characters:
- persephone
- hades
setting: vast shadow-realm hall of black obsidian columns, an obsidian throne draped with a
  dark fur, tall iron candelabras with warm amber flames, black river mist at the floor, a split
  pomegranate on the armrest
camera: 85mm portrait lens at f/1.8, intimate waist-up medium shot, framed from the hips up
  so legs and feet are out of frame, shallow depth of field
lighting: low-key amber candlelight rim light from the sides, soft warm glow on their faces,
  deep shadows, haze
blocking: the pale dark-haired man sits on the throne, one hand resting on her waist, the other
  lightly cupping the back of her neck; the olive-skinned woman sits sideways across his lap,
  one arm around his shoulders, the other hand raising a pomegranate seed toward his lips; their
  faces a few centimeters apart, her forehead almost touching his, eyes half-closed, slow shared
  breath, her hair spilling over his arm
wardrobe_state: her dark green and black sheer gauze gown slides off both shoulders with opaque
  black lining, deep neckline, high thigh slit, red silk sash, gold cuffs, wilted flower crown;
  his black cloak with fur collar hangs open from his shoulders over his bare chest, black leather
  trousers, silver chain at the waist; both fully covered below the chest line
motif: 'forbidden temptation and quiet surrender: a stern ruler of a shadow realm softened by
  a woman feeding him a pomegranate seed, mutual consent, slow-burn intimacy, power melting
  into tenderness'
mood: dark, hushed, sensual, devotional
negative: anime, cartoon, collage, split screen, twins, merged faces, blue skin, red hair, glowing
  red eyes, trident, staff, spear, pointed elf ears, illustration, painting, 3D render, CGI,
  concept art, extra fingers, deformed hands, text, watermark, minor, child
