id: baisuzhen_snake
name: 白素贞(蛇形)
age_look: adult woman, late 20s, serene thousand-year white-snake spirit in human
  form, graceful and alluring
face: pale porcelain skin, elegant oval face, long phoenix-shaped eyes with pale gold
  irises and subtle vertical pupils, soft red lips, faint pearly scale shimmer along
  the temples and collarbone; human-looking
hair: glossy black hair in an elegant Song-dynasty updo with white jade hairpins and
  a silver snake-shaped comb, a few loose strands framing the face
wardrobe: LOCKED ink-black sheer silk gauze top over a white silk inner bodice with
  plunging V neckline, off both shoulders, opaque lining, silver-teal snake-scale
  embroidery; below the hips the body is a single long serpent tail instead of legs,
  pearl-white scales fading to teal with faint glowing silver-teal belly scutes, the
  tail coiled on the floor with the tip visible; no legs, no feet
signature_props: cream oil-paper umbrella
notes: Adult female snake spirit from the Legend of the White Snake (public-domain
  folklore). Dark gothic photoreal live-action, West Lake mist mood, serpent menace.
  Approved samples show one face in two bodies, human legs in a black gauze and white
  dress, or one pearl-white blunt scaled tail with a teal belly. Silver snake hairpin.
  Not a fish tail.
